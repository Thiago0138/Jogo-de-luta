<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Kings of the Ring</title>
    <meta name="description" content="Auto-battle wrestling and boxing with super moves. Create your fighter, collect rare skins and climb to the top leagues." />
    <meta name="theme-color" content="#120a24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kings of the Ring" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      html,body{margin:0;height:100%;background:#120a24}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
      #splash{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a1460,#120a24 70%);color:#ffd23d;font:900 32px/1 Impact,system-ui,sans-serif;letter-spacing:2px;text-shadow:0 4px 0 #140a1c}
      #splash span{animation:p 1s ease-in-out infinite alternate}
      @keyframes p{to{transform:scale(1.08)}}
    </style>
  </head>
  <body>
    <div id="splash"><span>KINGS OF THE RING</span></div>
    <div id="app"></div>
    <script>
      /* Rede de segurança: se o jogo não arrancar, mostra o erro e opções em vez de ficar preso no ecrã inicial. */
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) { errs.push((e.message || 'error') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
        window.addEventListener('unhandledrejection', function (e) { errs.push('promise: ' + (e.reason && (e.reason.message || e.reason))); });
        setTimeout(function () {
          var sp = document.getElementById('splash');
          if (!sp) return;
          sp.innerHTML = '<div style="max-width:520px;padding:20px;text-align:center;font:600 15px/1.4 system-ui,sans-serif;color:#fff;text-shadow:none;letter-spacing:0">' +
            '<div style="font:900 26px Impact,system-ui;color:#ffd23d;margin-bottom:8px">KINGS OF THE RING</div>' +
            '<p>The game is taking too long to start.</p>' +
            '<p style="font-size:12px;color:#b9a8d8;word-break:break-word">' + (errs.join(' | ') || 'no error reported').replace(/</g, '&lt;') + '</p>' +
            '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">' +
            '<button id="bg-reload" style="padding:12px;border-radius:12px;border:0;background:#ffd23d;font-weight:900">Reload</button>' +
            '<button id="bg-main" style="padding:12px;border-radius:12px;border:0;background:#2f7bff;color:#fff;font-weight:900">Back to my main save</button>' +
            '<button id="bg-cache" style="padding:12px;border-radius:12px;border:0;background:#3a2a5c;color:#fff;font-weight:900">Clear app cache and reload</button>' +
            '</div></div>';
          document.getElementById('bg-reload').onclick = function () { location.reload(); };
          document.getElementById('bg-main').onclick = function () { try { localStorage.setItem('kotr-profile-pending', 'main'); } catch (e) {} location.reload(); };
          document.getElementById('bg-cache').onclick = function () {
            var p = [];
            try { if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })); } catch (e) {}
            try { if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); })); } catch (e) {}
            Promise.all(p).then(function () { location.reload(); }, function () { location.reload(); });
          };
        }, 7000);
      })();
    </script>
    <script>
      /* Perfis: troca o save principal por um "jogador novo" (e volta) antes de o jogo carregar. */
      (function () {
        try {
          var L = localStorage, act = L.getItem('kotr-profile-pending');
          if (!act) return;
          L.removeItem('kotr-profile-pending');
          var cur = L.getItem('kotr-profile') || 'main';
          var game = function (k) { return k === 'reis-do-ringue-save-v1' || (k.indexOf('kotr-') === 0 && k.indexOf('kotr-profile') !== 0 && k.indexOf('kotr-stash-') !== 0); };
          var keys = [], i;
          for (i = 0; i < L.length; i++) { var k = L.key(i); if (k && game(k)) keys.push(k); }
          if (act === 'reset-fresh') {
            if (cur !== 'fresh') return;
            keys.forEach(function (k) { L.removeItem(k); });
            return;
          }
          var to = act === 'fresh' ? 'fresh' : 'main';
          if (to === cur) return;
          var snap = {};
          keys.forEach(function (k) { snap[k] = L.getItem(k); });
          L.setItem('kotr-stash-' + cur, JSON.stringify(snap));
          keys.forEach(function (k) { L.removeItem(k); });
          var back = L.getItem('kotr-stash-' + to);
          if (back) {
            var o = JSON.parse(back);
            for (var key in o) if (o[key] != null) L.setItem(key, o[key]);
            L.removeItem('kotr-stash-' + to);
          }
          L.setItem('kotr-profile', to);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
